<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A beautiful macOS style glassmorphic trash bin -->
  <defs>
    <linearGradient id="trashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0" />
      <stop offset="100%" stop-color="#b0b0b0" />
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d0d0d0" />
    </linearGradient>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="50" cy="85" rx="30" ry="8" fill="rgba(0,0,0,0.3)" filter="blur(4px)" />
  
  <!-- Bin Body -->
  <path d="M 25 30 L 30 85 C 31 89 35 92 40 92 L 60 92 C 65 92 69 89 70 85 L 75 30 Z" fill="url(#trashGrad)" stroke="#808080" stroke-width="1.5" />
  
  <!-- Vertical lines on bin -->
  <line x1="38" y1="35" x2="40" y2="87" stroke="#909090" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="35" x2="50" y2="87" stroke="#909090" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="35" x2="60" y2="87" stroke="#909090" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Lid -->
  <ellipse cx="50" cy="30" rx="27" ry="6" fill="url(#lidGrad)" stroke="#808080" stroke-width="1.5" />
  <path d="M 40 28 C 40 24 44 21 50 21 C 56 21 60 24 60 28" fill="none" stroke="#808080" stroke-width="2.5" stroke-linecap="round" />
</svg>
